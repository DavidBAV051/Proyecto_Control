; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mhetesp32devkit]
platform = espressif32
board = mhetesp32devkit
framework = arduino
monitor_speed = 115200

; Per-module source folders under src/ (see src/<module>/) need their own
; include paths so headers can still be included by bare filename.
build_flags = 
    -Isrc/cam
    -Isrc/imu
    -Isrc/motors
    -Isrc/telemetry
    -Isrc/web_server
    -Isrc/espnow_link

lib_deps = 
    https://github.com/HuskyLens/HUSKYLENSArduino.git
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    esp32async/ESPAsyncWebServer @ ^3.12.1
    esp32async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.0.0